server {
    listen 80;
    server_name localhost;

    # The Vite app is built with base: "/finance/"
    # All static files will be served from /usr/share/nginx/html/finance/
    root /usr/share/nginx/html;

    # Serve the frontend
    location /finance/ {
        # Try serving the file directly. If not found, rewrite to index.html (SPA routing).
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /finance/index.html;
    }

    # Proxy API requests to the Spring Boot backend
    location /finance/api/ {
        # 'bankify' is the service name in docker-compose.yml
        proxy_pass http://bankify:8080/finance/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Redirect root to the app
    location = / {
        return 301 /finance/;
    }
}
